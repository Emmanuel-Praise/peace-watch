services:
  - type: web
    name: peace-watch-backend
    runtime: python
    # Code lives in backend/, so Render must run commands from there.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ALLOW_ALL
        value: true
      # Must match the "Verify token" you type in Meta's webhook settings.
      - key: WHATSAPP_VERIFY_TOKEN
        value: peacewatch
      - key: BOT_NAME
        value: Community Watch
      # Keeps a cleared DB cleared (no auto-reseed of demo reports).
      - key: DEMO_AUTO_SEED
        value: false
      # Set these in Render → Environment (secrets, never committed):
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: 1473717102482673
